<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>思想免疫训练册 · 单机版</title>
<style>
:root{--bg:#f4f1e8;--paper:#fffdf7;--ink:#1f2328;--muted:#6b706f;--accent:#2f5d50;--line:#d9d3c5;--ok:#e8f3ec;--bad:#f7e9e7;--soft:#ece7d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Serif SC","Songti SC","Microsoft YaHei",serif;line-height:1.75}
header{padding:42px 20px 26px;background:linear-gradient(#eee7d7,#f4f1e8);border-bottom:1px solid var(--line)}
.wrap{max-width:920px;margin:auto}h1{margin:0 0 10px;font-size:clamp(28px,5vw,46px)}.subtitle{color:var(--muted)}
.badge{display:inline-block;padding:4px 10px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:13px;margin-bottom:16px}
main{padding:28px 18px 70px}.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 5px 20px #00000008}
.qno{font-size:13px;color:var(--accent);font-weight:700}.qtext{font-size:20px;font-weight:700;margin:8px 0 16px}
.option{display:block;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;cursor:pointer;background:#fff}.option:hover{background:#fbf8ef}
button{border:0;border-radius:12px;background:var(--accent);color:#fff;padding:13px 20px;font-size:16px;cursor:pointer}.secondary{background:#7c7469}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}#result{display:none}.scoreBox{font-size:24px;font-weight:700;padding:18px;border-radius:14px;background:var(--soft);margin-bottom:18px}
.ans{padding:10px 12px;border-radius:9px;margin:8px 0}.correct{background:var(--ok);color:#184f35}.wrong{background:var(--bad);color:#762727}
.over{background:#f3eee0;border:1px dashed #aa956f;padding:12px;border-radius:9px;margin-top:12px}.small{font-size:14px;color:var(--muted)}
.progress{height:8px;background:#ddd6c8;border-radius:999px;overflow:hidden;margin-top:14px}.progress>div{height:100%;background:var(--accent);width:0}
.notice{background:#fff8dc;border:1px solid #e2d29b;padding:14px;border-radius:12px;margin:20px 0}
footer{color:var(--muted);font-size:13px;padding:35px 0 60px}
</style>
</head>
<body>
<header><div class="wrap"><div class="badge">离线单文件 · 无需联网</div><h1>思想免疫训练册</h1><div class="subtitle">第一轮只答题；提交后进入第二轮解析，逐项解释 A/B/C/D，并定位“符号越权”。</div></div></header>
<main class="wrap">
<section class="card"><h2>答题纪律</h2><p>不要选“最爽”的答案，选<strong>边界最清楚、机制最完整、最能接受证据与反例检验</strong>的答案。</p><p class="small">训练程序：现象 → 概念 → 前提 → 机制 → 竞争解释 → 证据 → 反例。</p><div class="progress"><div id="bar"></div></div></section>
<section id="quiz"></section>
<div class="actions"><button id="submitBtn">提交试卷并进入第二轮解析</button><button id="resetBtn" class="secondary">清空重做</button></div>
<section id="result"><div class="scoreBox" id="scoreBox"></div><div class="notice">第二轮不只告诉你正确答案。重点检查：错误选项在哪一步把概念、模型、价值判断或直觉越权成了现实结论。</div><div id="analysis"></div><div class="actions"><button id="retryBtn">重新生成一轮（打乱题序与选项）</button></div></section>
<footer>思想训练不是学习怎样永远证明自己正确，而是训练自己在错误发生之前，拥有发现自己可能错误的能力。</footer>
</main>
<script>
const base=[{"tag":"意图论","q":"某城市过去五年房价上涨70%，普通劳动者工资只上涨20%。下列哪种判断最符合“思想免疫”方法？","options":{"A":"这已经证明资本有计划地制造住房短缺。","B":"房价涨幅明显高于工资涨幅，但原因仍需分解住房供给、金融条件、土地制度、人口流动等机制。","C":"只要房价上涨，就是剥削。","D":"市场价格既然形成，就说明结果必然合理。"},"answer":"B","analysis":{"A":"错误：把结构结果直接跳成行为意图，缺少意图证据。","B":"正确：保留可观察事实，并要求机制、竞争解释和证据。","C":"错误：把价格现象直接套入“剥削”概念，概念越权。","D":"错误：现实如此不等于应该如此，属于自然化。"},"overreach":"把价格变化未经机制分析直接升级成“资本意图”或“剥削本质”。"},{"tag":"概念边界","q":"某公司利润率达到30%。下列哪种说法最严谨？","options":{"A":"30%的利润率就等于30%的剩余价值率。","B":"利润越高，剥削必然越严重。","C":"利润率是会计/经济指标，剩余价值率是特定价值理论中的概念，二者不能未经转换直接画等号。","D":"利润都是虚假的，因为只有劳动才是真实的。"},"answer":"C","analysis":{"A":"错误：两者分母、理论体系和测量口径不同。","B":"错误：利润还可能受技术、市场势力、风险、税制、资产收益等影响。","C":"正确：先区分统计概念与理论概念，再建立可检验接口。","D":"错误：不能因为批判某种资本关系，就抹掉金融、组织、技术等真实功能。"},"overreach":"把现实会计量“利润”直接当成“剩余价值/剥削”的同义词。"},{"tag":"历史前提自然化","q":"“企业必须追求利润，否则无法生存，所以利润最大化是人类生产活动的自然规律。”主要问题是什么？","options":{"A":"没有问题，这是定义。","B":"把特定制度和竞争条件下的约束，升级成了超历史的自然规律。","C":"只错在没有考虑通货膨胀。","D":"只要换成国有企业，这个问题就自动消失。"},"answer":"B","analysis":{"A":"错误：这不是中性定义，而是从条件命题推出本体论命题。","B":"正确：盈利约束可以真实存在，但不等于一切生产天然以利润最大化为目的。","C":"错误：关键不是遗漏变量，而是历史前提自然化。","D":"错误：所有制变化不自动解决信息、激励、治理等问题。"},"overreach":"把模型成立条件当成现实世界的永恒本质。"},{"tag":"AI与符号越权","q":"“AI数据越来越多，因此最终一定能完整计算全社会真实需要，并取代市场。”最准确的评价是？","options":{"A":"完全正确，数据越多就越接近全知。","B":"完全错误，AI对经济协调没有任何价值。","C":"AI可以提高预测与协调能力，但不能由此推出它能穷尽隐性知识、价值冲突和动态偏好。","D":"只要算力够大，就不存在知识分散问题。"},"answer":"C","analysis":{"A":"错误：更多数据不等于完整现实。","B":"错误：AI仍可提高预测、库存、物流和审计能力。","C":"正确：承认能力提升，同时保留边界与反例条件。","D":"错误：算力不自动解决信息可得性、偏好形成和制度合法性。"},"overreach":"把模型处理能力上升升级成“模型与现实完全同一”。"},{"tag":"阶级万能论","q":"某地区失业率明显上升。哪一项最符合严谨的政治经济学分析？","options":{"A":"直接说明资本故意制造产业后备军。","B":"先区分周期衰退、技术变化、结构错配、地区迁移等原因，再检验失业是否削弱劳动议价。","C":"失业与阶级关系没有任何联系。","D":"只要工资下降，就可以证明失业是人为制造的。"},"answer":"B","analysis":{"A":"错误：“失业产生议价压力”与“故意制造失业”是两个命题。","B":"正确：先分解来源，再检验结构效果，最后才讨论意图。","C":"错误：失业可以影响退出能力和议价。","D":"错误：工资下降不能直接证明主体意图。"},"overreach":"把阶级分析从一个解释层变成对所有未解释现象的万能残差项。"},{"tag":"机制链","q":"AI投资增加后，消费级硬件价格上涨。哪种分析方式最好？","options":{"A":"AI资本必然挤压普通消费者，这是唯一解释。","B":"分别检验共用产能挤压、整体扩产、汇率、关税、库存和厂商定价等机制。","C":"价格上涨与AI一定无关。","D":"只要出现涨价，就说明存在垄断。"},"answer":"B","analysis":{"A":"错误：把可能机制当作唯一机制，单因果越权。","B":"正确：建立竞争机制链，并让数据决定哪条更重要。","C":"错误：不能因A非唯一原因就断言A无作用。","D":"错误：涨价可来自需求、成本、库存、关税、市场势力等多种原因。"},"overreach":"把相关现象直接塞入预设因果链，不允许竞争解释存在。"},{"tag":"局部经验外推","q":"某地区提高最低工资后，失业率没有上升。最严谨的结论是什么？","options":{"A":"最低工资永远不会影响就业。","B":"这说明供求规律已经失效。","C":"在该地区、该幅度和该时期内，没有观察到明显失业上升；是否可推广需继续检验。","D":"只要劳动者受益，任何幅度的最低工资都无需评估副作用。"},"answer":"C","analysis":{"A":"错误：把局部经验升级成普遍规律。","B":"错误：现实可能存在市场势力、利润空间和生产率调整等机制。","C":"正确：明确地区、时期、政策幅度和外推边界。","D":"错误：规范目标正确不等于所有政策参数都自动有效。"},"overreach":"从“这个案例成立”直接推出“所有案例都成立”。"},{"tag":"制度名称代替机制","q":"“某社会主义国家出现官僚主义，所以公有制必然导致官僚主义。”主要错误是什么？","options":{"A":"把制度标签直接当作因果机制，跳过监督、任免、信息结构、权力退出等中间变量。","B":"只错在没有计算GDP。","C":"完全正确，因为所有国家最终都一样。","D":"官僚主义只能出现在私有制社会。"},"answer":"A","analysis":{"A":"正确：制度名称不能代替机制。","B":"错误：这是因果识别问题，不是宏观总量问题。","C":"错误：把单一案例提升成跨制度必然律。","D":"错误：官僚化风险不由单一所有制独占。"},"overreach":"把“公有制/私有制”等制度名称当成解释一切结果的因果按钮。"},{"tag":"规范→机制","q":"“正义要求劳动者获得自己的全部劳动成果，因此合理制度应按劳动量直接安排全部交换。”最大问题是什么？","options":{"A":"规范目标直接替代了可运行的经济机制设计。","B":"劳动量完全不能测量，所以劳动分析毫无意义。","C":"只要把劳动换成货币就解决了。","D":"公平问题与经济学无关。"},"answer":"A","analysis":{"A":"正确：即使接受规范目标，也仍需回答劳动比较、公共品、折旧、风险、社会基金等机制问题。","B":"错误：劳动可被部分测量，但测量不自动解决价值和再生产问题。","C":"错误：货币不能自动解决规范与制度设计问题。","D":"错误：公平与分配可以是经济研究对象。"},"overreach":"把“应该怎样”直接当成“现实能够怎样运行”。"},{"tag":"现实→规范","q":"“市场竞争形成了现在的工资结构，所以现在的工资结构就是合理的。”最准确的批评是？","options":{"A":"从事实判断直接跳到了规范判断。","B":"工资都是假的。","C":"只要市场存在，所有交换都不是自愿的。","D":"市场竞争从来不会形成工资。"},"answer":"A","analysis":{"A":"正确：现实如此不等于应该如此。","B":"错误：工资是现实收入形式。","C":"错误：自愿交换可能存在，但退出能力仍需分析。","D":"错误：供求和竞争确实会影响工资，只是不能穷尽全部机制。"},"overreach":"把描述性事实变成价值正当性证明。"},{"tag":"P0边界","q":"你走进工厂，看到工人工作12小时、老板开豪车、公司利润增长30%。第一步应该是什么？","options":{"A":"立即宣布剥削率提高30%。","B":"先记录观察事实，再建立多个竞争性假说并寻找工资、工时、生产率和利润来源数据。","C":"老板开豪车足以证明企业违法。","D":"只要工人自愿签合同，就无需进一步分析。"},"answer":"B","analysis":{"A":"错误：利润增长、工时和剩余价值率不是同一概念。","B":"正确：P0负责提示“值得研究”，不负责直接给出答案。","C":"错误：消费表象不能直接证明企业行为机制。","D":"错误：形式自愿不排除市场势力、退出能力和劳动条件问题。"},"overreach":"把前符号经验/直觉直接当作已经完成的因果证明。"},{"tag":"语言免疫","q":"下面哪句话最符合成熟的理论语言？","options":{"A":"资本永远想要制造失业。","B":"人民需要什么是显而易见的。","C":"在岗位稀缺、保障不足等条件下，较高失业可能削弱劳动者退出能力和工资议价。","D":"国家决定了这一切。"},"answer":"C","analysis":{"A":"错误：把结构激励拟人化为统一意图，而且“永远”抹掉边界。","B":"错误：“人民需要”必须回答谁识别、怎样聚合、冲突如何处理。","C":"正确：主语具体、条件明确、机制可检验、允许反例。","D":"错误：“国家”过于抽象，需要具体到机构、规则和程序。"},"overreach":"抽象主语吞掉了现实中的具体主体、条件和机制。"}];
let questions=[];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){questions=JSON.parse(JSON.stringify(base));shuffle(questions);questions.forEach(q=>{let es=Object.entries(q.options);shuffle(es);let no={},map={},ls=["A","B","C","D"];es.forEach((e,i)=>{no[ls[i]]=e[1];map[ls[i]]=e[0]});let na=Object.keys(map).find(k=>map[k]===q.answer),an={};Object.keys(map).forEach(k=>an[k]=q.analysis[map[k]]);q.options=no;q.answer=na;q.analysis=an})}
function render(){let z=document.getElementById("quiz");z.innerHTML="";questions.forEach((q,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML=`<div class="qno">第 ${i+1} 题 · ${q.tag}</div><div class="qtext">${q.q}</div>`+Object.entries(q.options).map(([k,v])=>`<label class="option"><input type="radio" name="q${i}" value="${k}"> <strong>${k}.</strong> ${v}</label>`).join("");z.appendChild(d)});progress()}
function progress(){let n=0;questions.forEach((q,i)=>{if(document.querySelector(`input[name=q${i}]:checked`))n++});document.getElementById("bar").style.width=(100*n/questions.length)+"%"}
document.addEventListener("change",e=>{if(e.target.matches('input[type=radio]'))progress()});
function submit(){let a=[],m=[];questions.forEach((q,i)=>{let e=document.querySelector(`input[name=q${i}]:checked`);if(!e)m.push(i+1);a.push(e?e.value:null)});if(m.length){alert("还有未作答题目："+m.join("、"));return}let s=0;a.forEach((x,i)=>{if(x===questions[i].answer)s++});let p=Math.round(s/questions.length*100),lv=p>=90?"免疫系统稳定":p>=75?"基础较稳，仍有越权点":p>=60?"需要继续机制训练":"建议从概念边界重新训练";document.getElementById("scoreBox").innerHTML=`得分：${s} / ${questions.length}（${p}%）<br><span class="small">${lv}</span>`;let an=document.getElementById("analysis");an.innerHTML="";questions.forEach((q,i)=>{let d=document.createElement("div");d.className="card";let o="";for(let [k,v] of Object.entries(q.options)){let c=k===q.answer?"correct":"wrong",mk=k===q.answer?"✓ 正确":"✗ 错误",ch=k===a[i]?" · 你的选择":"";o+=`<div class="ans ${c}"><strong>${k}. ${mk}${ch}</strong><br>${v}<br>${q.analysis[k]}</div>`}d.innerHTML=`<div class="qno">解析 ${i+1} · ${q.tag}</div><div class="qtext">${q.q}</div>${o}<div class="over"><strong>符号越权定位：</strong>${q.overreach}</div>`;an.appendChild(d)});document.getElementById("result").style.display="block";document.getElementById("submitBtn").style.display="none";document.getElementById("result").scrollIntoView({behavior:"smooth"})}
function reset(){document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);document.getElementById("result").style.display="none";document.getElementById("submitBtn").style.display="inline-block";progress();window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("submitBtn").onclick=submit;document.getElementById("resetBtn").onclick=reset;document.getElementById("retryBtn").onclick=()=>{prepare();render();reset()};prepare();render();
</script>
</body></html>
